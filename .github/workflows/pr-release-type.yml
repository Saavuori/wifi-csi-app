name: pr release type

# Every pull request declares how it moves the version, and that declaration is what the
# release job later acts on. Checked here rather than at merge time so the answer is visible
# while the PR is being reviewed — a release that fails because nobody labelled the PR is a
# release that fails after the merge button, which is the worst moment to find out.
#
# One label, exactly:
#
#   release:major   breaking change      1.4.2 -> 2.0.0
#   release:minor   new feature          1.4.2 -> 1.5.0
#   release:patch   fix or internal      1.4.2 -> 1.4.3
#   release:skip    no release           unchanged  (docs, CI, refactors)
#
# A conventional-commit PR title works too and is applied automatically, so most PRs need no
# label at all: `feat:` is minor, `fix:`/`perf:`/`refactor:` are patch, a `!` or a
# BREAKING CHANGE footer is major, and `docs:`/`ci:`/`test:`/`chore:` are skip.

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-release-type-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The classifier decides every version this repo ever publishes, and it is shared with
      # the release job, so it is worth more than a code review.
      - name: Test the classifier
        run: node .github/scripts/release-type.test.js

      - name: Resolve the release type
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/release-type.js');
            const pr = context.payload.pull_request;
            const result = script.resolve({
              labels: pr.labels.map((l) => l.name),
              title: pr.title,
              body: pr.body || '',
            });

            core.info(`title:  ${pr.title}`);
            core.info(`labels: ${pr.labels.map((l) => l.name).join(', ') || '(none)'}`);

            if (result.error) {
              core.setFailed(result.error);
              return;
            }
            core.info(`release type: ${result.type} (from ${result.source})`);
            core.summary
              .addHeading('Release type', 3)
              .addRaw(`This PR is **${result.type}**, taken from ${result.source}.`)
              .addRaw(
                result.type === 'skip'
                  ? ' No release will be cut when it merges.'
                  : ' Merging it will bump the version and publish a release.',
              )
              .write();
