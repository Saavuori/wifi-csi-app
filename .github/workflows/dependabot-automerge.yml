name: Dependabot auto-merge

# Dependabot opens enough PRs across these repos that patch and minor bumps are
# pure noise -- they should land on their own. Majors are deliberately held back
# for review: that is where the breaking changes live. typescript 6->7 and
# vite 5->8 both failed CI when they showed up, so "just merge everything" is
# not a safe default here.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # For a grouped PR, update-type is the *highest* bump in the group, so a
      # group containing a single major is held back whole rather than merged
      # on the strength of its other members.
      - name: Enable auto-merge for patch and minor bumps
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
