name: release

# Cuts a release when a pull request merges into main, using the release type that PR declared.
#
# The version lives in git tags. `server/pyproject.toml` and `web/package.json` are updated to
# match so an installed package reports the same number, but the tag is what is authoritative —
# it is what the image is built from and the only record that survives someone editing a file
# by hand.
#
# Triggered on the merge rather than on the tag, because the PR is where the release type is
# written down and a tag carries no such information.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      type:
        description: "Release type to force"
        required: true
        type: choice
        options: [major, minor, patch]

permissions:
  contents: write

concurrency:
  # Never two releases at once: both would compute the same "next" version from the same tag.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: version and tag
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.next.outputs.skip }}
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The branch, named, rather than whatever this event checks out by default. On a
          # pull_request event that default is `refs/pull/N/merge`, and the release commit is
          # pushed on top of it — which is a fast-forward only because a merge-commit merge
          # leaves that ref pointing at the commit now on main. Squash and rebase merges are
          # both enabled on this repo, and either one makes the merge ref an ephemeral commit
          # that is not a descendant of the branch tip: the push is rejected, and the release
          # quietly does not happen. Checking out the branch removes the dependence on how the
          # button was pressed.
          #
          # Resolved from the event rather than hardcoded, like pages.yml, so that renaming the
          # default branch does not silently stop releases.
          ref: ${{ github.event.repository.default_branch }}
          # Full history and tags: the next version is computed from the last one.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the next version
        id: next
        uses: actions/github-script@v9
        with:
          script: |
            const { resolve, bump } = require('./.github/scripts/release-type.js');
            const { execSync } = require('child_process');

            let type;
            if (context.eventName === 'workflow_dispatch') {
              type = context.payload.inputs.type;
              core.info(`release type ${type}, forced by workflow_dispatch`);
            } else {
              const pr = context.payload.pull_request;
              const result = resolve({
                labels: pr.labels.map((l) => l.name),
                title: pr.title,
                body: pr.body || '',
              });
              if (result.error) {
                // The PR check should have caught this long before the merge. If it somehow
                // did not, refusing is better than guessing at someone's intent.
                core.setFailed(`Cannot release: ${result.error}`);
                return;
              }
              type = result.type;
              core.info(`release type ${type}, from ${result.source}`);
            }

            if (type === 'skip') {
              core.info('This PR is marked release:skip — nothing to release.');
              core.setOutput('skip', 'true');
              return;
            }

            // Latest tag by version order, not by date: a patch on an old branch must not be
            // read as the newest release.
            const tags = execSync('git tag --list "v*" --sort=-v:refname')
              .toString().trim().split('\n').filter(Boolean);
            const current = tags.length > 0 ? tags[0] : 'v0.0.0';
            const version = bump(current, type);

            core.info(`${current} -> v${version}`);
            core.setOutput('skip', 'false');
            core.setOutput('type', type);
            core.setOutput('previous', current);
            core.setOutput('version', version);
            core.setOutput('tag', `v${version}`);

      - name: Update the version files and changelog
        if: steps.next.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
          RELEASE_TYPE: ${{ steps.next.outputs.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python .github/scripts/apply_version.py

      - name: Commit, tag and push
        if: steps.next.outputs.skip == 'false'
        env:
          TAG: ${{ steps.next.outputs.tag }}
          VERSION: ${{ steps.next.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pyproject.toml web/package.json CHANGELOG.md
          git commit -m "Release ${TAG}" -m "[skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          # This push triggers nothing — a push made with GITHUB_TOKEN never starts a workflow
          # run. That is why the image is built by the job below rather than by ci.yml noticing
          # the tag.
          #
          # The branch first, the tag second. If someone else lands a commit between the
          # checkout and here the branch push is rejected, `set -e` stops, and no tag is
          # created — a release that did not happen, rather than a tag naming a commit that is
          # on no branch.
          git push origin "HEAD:${BRANCH}"
          git push origin "${TAG}"

      - name: Create the GitHub release
        if: steps.next.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
          # apply_version.py needs the same environment here as it did above. Passing only TAG
          # and PREVIOUS left VERSION unset, and the script exits on that — after the tag had
          # already been pushed, so v0.1.0 existed with no release attached to it.
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
          RELEASE_TYPE: ${{ steps.next.outputs.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NOTES=$(python .github/scripts/apply_version.py --notes-only)
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"

  # Built from the tag, in the same run that created it. A release that cannot produce an image
  # now fails here, visibly, instead of being discovered later by someone whose `docker pull`
  # returns "manifest unknown".
  #
  # This is also the only place `latest` moves. It means "newest release", which is what
  # `install.sh` pulls when nobody says otherwise, and the reason it is set here rather than in
  # ci.yml is that a release is the only build anyone has actually decided to ship.
  image:
    name: image
    needs: release
    if: needs.release.outputs.skip == 'false'
    permissions:
      contents: read
      packages: write
      # See the note in ci.yml: without this the job token cannot write the build cache.
      actions: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      push: true
      # Given explicitly rather than read from the ref: this workflow runs on the merged pull
      # request, so `github.ref` here is the merge ref and metadata-action would derive `pr-N`.
      #
      # `latest` is unconditional because the version above is always a bump of the highest
      # existing tag — there is no path through this workflow that releases a fix to an older
      # line, so there is none that drags `latest` backwards.
      tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
        type=raw,value=latest
