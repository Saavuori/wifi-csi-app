name: ci

# Everything check.sh runs, plus the container image. The three check jobs are split rather
# than run in sequence because they share nothing and a failure should say which layer broke
# without waiting for the others.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - run: pip install -e "server[dev]"

      - run: python -m pytest server/tests -q

      # The Pi node's tests parse its datagrams with the server's own protocol module, so they
      # run here where that package is installed rather than in a job of their own.
      - run: python -m pytest pi/tests -q

      - run: python -m ruff check .
        working-directory: server

      - run: python -m ruff check --config server/pyproject.toml pi

  firmware:
    name: firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ring buffer and the wire header compile with a plain host cc — no ESP-IDF, no
      # board. These are the two places where a firmware mistake is invisible on the device.
      - run: ./firmware/scripts/run_host_tests.sh

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

  image:
    name: image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [server, firmware, web]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated here. Only the pip install runs under it — the front end stage is
      # pinned to the build platform in the Containerfile — and numpy/scipy resolve to
      # prebuilt aarch64 wheels, so nothing in the emulated half actually compiles.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # What the running server reports on /api/version and shows in the header. A tag build
      # takes its version from the tag; anything else is labelled with the branch and short
      # SHA, so an image someone pulled off a feature branch never claims to be a release.
      - id: build-info
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-${GITHUB_REF_NAME//\//-}.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CSI_VERSION=${{ steps.build-info.outputs.version }}
            CSI_COMMIT=${{ github.sha }}
            CSI_BUILT_AT=${{ steps.build-info.outputs.built_at }}
          # A pull request builds to prove the Containerfile still works, and publishes
          # nothing. Everything else publishes under its own branch or version tag; `latest`
          # only ever moves on the default branch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # `mode=min` and `ignore-error=true`, both for the same incident. GitHub gives a repo
          # 10 GB of Actions cache; `mode=max` stores every intermediate layer of a two-platform
          # build, which filled it (559 entries, 10.14 GB) and left later runs unable to reserve
          # space. Export then failed with "failed to reserve cache" and took the whole job with
          # it — on a pull request, where this job publishes nothing, so a green image build was
          # turned red by housekeeping after the image had already built successfully.
          #
          # `ignore-error=true` is the part that matters: a cache is an optimization, and losing
          # one must never fail a build. `mode=min` keeps it from refilling as fast, at the cost
          # of colder builds for cache misses.
          cache-to: type=gha,mode=min,ignore-error=true
          # Without this the package listing grows an "unknown/unknown" entry per platform,
          # which makes it look like the multi-arch manifest is broken when it is not.
          provenance: false
