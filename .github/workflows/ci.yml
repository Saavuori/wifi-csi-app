name: ci

# Everything check.sh runs, plus the container image. The three check jobs are split rather
# than run in sequence because they share nothing and a failure should say which layer broke
# without waiting for the others.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - run: pip install -e "server[dev]"

      - run: python -m pytest server/tests -q

      # The Pi node's tests parse its datagrams with the server's own protocol module, so they
      # run here where that package is installed rather than in a job of their own.
      - run: python -m pytest pi/tests -q

      - run: python -m ruff check .
        working-directory: server

      - run: python -m ruff check --config server/pyproject.toml pi

  firmware:
    name: firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ring buffer and the wire header compile with a plain host cc — no ESP-IDF, no
      # board. These are the two places where a firmware mistake is invisible on the device.
      - run: ./firmware/scripts/run_host_tests.sh

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

  # The build itself lives in image.yml so that release.yml runs exactly this one, rather than
  # keeping a second copy that can drift. The `v*` push trigger above still reaches it, which
  # covers a tag pushed by hand — but a release no longer depends on that, because a tag pushed
  # by a workflow never triggers anything. See the header of image.yml.
  image:
    name: image
    needs: [server, firmware, web]
    permissions:
      contents: read
      packages: write
      # The GHA cache backend writes through the job token. Naming any permission sets every
      # other one to `none`, so leaving this out is what denied the cache write with "token has
      # no writable scopes" — silently, as a warning, until the export failed on top of it.
      actions: write
    uses: ./.github/workflows/image.yml
    with:
      # A pull request builds to prove the Containerfile still works, and publishes nothing.
      # Everything else publishes under its own branch or version tag.
      push: ${{ github.event_name != 'pull_request' }}
      # No `latest` here. It names the newest *release* — see release.yml — because `install.sh`
      # pulls it by default, and a fresh install landing on an unreviewed main build is how a Pi
      # ends up running a version that was never released. `main` is still published under its
      # own name for anyone who wants exactly that.
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
