# docker compose -f deploy/compose.yaml up -d
#
# The server alone. Nodes report to it over UDP 5566 — a Pi running csi-node.service, or ESP32
# boards pointed at this host.

name: csi

services:
  csi:
    image: ${CSI_IMAGE:-ghcr.io/saavuori/wifi-csi-app:latest}
    # Only used by `docker compose build`; a plain `up` pulls the published image instead.
    build:
      context: ..
      dockerfile: deploy/Containerfile
    container_name: csi
    restart: unless-stopped

    ports:
      # HTTP on all interfaces so you can open the app from a laptop on the same LAN. There is
      # no authentication — put CSI_HTTP_BIND=127.0.0.1 here and a reverse proxy in front of it
      # if this host is reachable from anywhere you do not control.
      - "${CSI_HTTP_BIND:-0.0.0.0}:${CSI_HTTP_PORT:-8080}:8080"
      # UDP has to be reachable from the LAN: this is where the nodes send.
      - "${CSI_UDP_PORT:-5566}:5566/udp"

    environment:
      # Recording is on by default, as it is in the app. A node at 80 Hz writes about 1 GB a
      # day — set CSI_RECORD=false for a quick look, especially on an SD card.
      CSI_RECORD: "${CSI_RECORD:-true}"
      CSI_METRICS_HZ: "${CSI_METRICS_HZ:-5}"

    volumes:
      - csi-data:/data

volumes:
  csi-data:
